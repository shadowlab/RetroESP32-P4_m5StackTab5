# Build the M5Stack Tab5 firmware: the launcher and every emulator app, each in its own job,
# then merge them into one flashable image (RetroESP32_P4_Tab5_v1.bin, flash at 0x0).
# Built with ESP-IDF 5.5.2, the toolchain releases are made with.  build_all_tab5.sh fails a job when
# an image does not fit its partition in partitions_ota.csv.
# Every push to main (a merged pull request) publishes a GitHub release with the merged image, tagged
# tab5-build-<run number>. Each release also carries the image as RetroESP32_P4_Tab5.bin, so the newest one is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/RetroESP32_P4_Tab5.bin
# (no GitHub login needed, unlike workflow artifacts).
# Pushing a tag named tab5-v<version> (e.g. tab5-v0.1.0, or tab5-v0.1.0-beta.1 for a pre-release)
# publishes a versioned release the same way.
name: Build Tab5 firmware

on:
  push:
    branches: [main]   # other branches build through their pull request
    tags: ['tab5-v*']  # release builds (path filters do not apply to tag pushes)
    paths-ignore: ['**.md', 'images/**', 'promo/**', 'SDcard/**']
  pull_request:
    paths-ignore: ['**.md', 'images/**', 'promo/**', 'SDcard/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }} (IDF ${{ matrix.idf }})
    # No job container: pulling the multi-GB espressif/idf image took about a minute per job. ESP-IDF
    # with only the ESP32-P4 tools is installed once and kept in the Actions cache (see below).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        idf: ['5.5.2']
        project: [launcher, nes, gb, sms, snes, genesis, neogeo]
    env:
      IDF_PATH: ${{ github.workspace }}/../esp-idf
      IDF_TOOLS_PATH: ${{ github.workspace }}/../.espressif
      CCACHE_VERSION: 4.11.3
      # ccache, kept between runs per app (see the cache step). Paths are made relative to the
      # workspace and compilers are compared by content, so hits survive across runs and branches.
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5

      # The Python venv inside the tools dir points at the runner's python3, so its version is in the key.
      - name: ESP-IDF cache key
        id: idf-key
        shell: bash
        run: echo "key=idf${{ matrix.idf }}-esp32p4-$ImageOS-py$(python3 -c 'import platform; print(platform.python_version())')-ccache$CCACHE_VERSION-v1" >> "$GITHUB_OUTPUT"

      # One entry shared by every app job. Caches saved on main are readable by pull requests.
      - name: Restore ESP-IDF
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.IDF_PATH }}
            ${{ env.IDF_TOOLS_PATH }}
          key: ${{ steps.idf-key.outputs.key }}

      - name: Install ESP-IDF (cache miss only)
        if: steps.idf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone -q -b v${{ matrix.idf }} --depth 1 --recursive --shallow-submodules \
            https://github.com/espressif/esp-idf.git "$IDF_PATH"
          rm -rf "$IDF_PATH/.git" "$IDF_PATH"/.git* # not needed to build; keeps the cache small
          "$IDF_PATH/install.sh" esp32p4 > /dev/null
          python3 "$IDF_PATH/tools/idf_tools.py" install cmake ninja > /dev/null
          mkdir -p "$IDF_TOOLS_PATH/bin"
          curl -sSfL "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-linux-x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$IDF_TOOLS_PATH/bin" "ccache-$CCACHE_VERSION-linux-x86_64/ccache"
          rm -rf "$IDF_TOOLS_PATH/dist"              # downloaded archives, already unpacked
          du -sh "$IDF_PATH" "$IDF_TOOLS_PATH"

      # Each run saves a new cache entry; restore-keys picks the newest one for this app. PR runs
      # can read caches saved by main, so a PR touching one core recompiles only that core.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-idf${{ matrix.idf }}-${{ matrix.project }}-${{ github.sha }}
          restore-keys: ccache-idf${{ matrix.idf }}-${{ matrix.project }}-

      - name: Build
        shell: bash
        run: |
          export PATH="$IDF_TOOLS_PATH/bin:$PATH"
          . "$IDF_PATH/export.sh" > /dev/null
          ccache --zero-stats > /dev/null
          ./build_all_tab5.sh ${{ matrix.project }}
          { echo "### ccache: ${{ matrix.project }}"; echo '```'; ccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: tab5-idf${{ matrix.idf }}-${{ matrix.project }}
          path: firmware_tab5/*.bin
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge image (IDF ${{ matrix.idf }})
    needs: build
    # Merging only needs esptool (the 4.x series ESP-IDF 5.5 uses), not the whole ESP-IDF.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        idf: ['5.5.2']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: tab5-idf${{ matrix.idf }}-*
          path: firmware_tab5
          merge-multiple: true

      - name: Merge
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install -q 'esptool~=4.12'
          ./build_all_tab5.sh --merge-only | tee merge.log
          {
            echo "### Tab5 image sizes (ESP-IDF ${{ matrix.idf }})"
            echo '```'
            grep ' KB / ' merge.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: RetroESP32_P4_Tab5-idf${{ matrix.idf }}
          path: |
            RetroESP32_P4_Tab5_v1.bin
            firmware_tab5/*.bin
            merge.log
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/tab5-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: RetroESP32_P4_Tab5-idf5.5.2
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cd dist
          if [ "$REF_TYPE" = tag ]; then
            TAG="$REF_NAME"                       # versioned release: tab5-v1.2.0
            title="M5Stack Tab5 ${TAG#tab5-}"
          else
            TAG="tab5-build-$RUN_NUMBER"          # merge to main: tab5-build-57
            title="M5Stack Tab5 build $RUN_NUMBER (${GITHUB_SHA::8})"
          fi
          main="RetroESP32_P4_Tab5_${TAG#tab5-}.bin"
          cp RetroESP32_P4_Tab5_v1.bin "$main"
          # Same image under a fixed name, for .../releases/latest/download/RetroESP32_P4_Tab5.bin
          cp RetroESP32_P4_Tab5_v1.bin RetroESP32_P4_Tab5.bin
          sha256sum "$main" RetroESP32_P4_Tab5.bin > SHA256SUMS

          prerelease=()
          [[ "$TAG" =~ ^tab5-v[0-9.]+- ]] && prerelease=(--prerelease)

          {
            echo "Firmware for the **M5Stack Tab5**, built by CI from \`${GITHUB_SHA::8}\`."
            if [ "$REF_TYPE" != tag ]; then
              echo
              # A merge commit's first line is "Merge pull request #N from ...", its third the PR title
              subject=$(printf '%s\n' "$COMMIT_MSG" | head -1)
              [[ "$subject" == "Merge pull request"* ]] && subject="$subject: $(printf '%s\n' "$COMMIT_MSG" | sed -n 3p)"
              echo "Automatic build of \`main\` after: **$subject**"
              echo "Build-tested by CI; check the pull request for what has been tried on a Tab5."
            fi
            echo
            echo "> **First update the ESP32-C6 firmware** with the separate [tab5-p4-c6-sdio-ota](https://github.com/shadowlab/tab5-p4-c6-sdio-ota) updater"
            echo "> (flash it on its own, wait for \`[PASS]\` in its log). It is not part of this release."
            echo
            echo "Then flash \`$main\`, built with ESP-IDF 5.5.2. It is a complete image (bootloader, partition table, launcher and the NES, Game Boy, Master System, SNES, Genesis and Neo Geo emulators), written at 0x0:"
            echo
            echo '```'
            echo "python -m esptool --chip esp32p4 -b 460800 write_flash 0x0 $main"
            echo '```'
            echo
            echo "Build steps, the hardware map and a first-boot checklist are in [TAB5.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/TAB5.md)."
            if [ ${#prerelease[@]} -ne 0 ]; then
              echo
              echo "> **Pre-release:** build-tested only, not yet run on a Tab5. Please report what works (TAB5.md lists what to check)."
            fi
            echo
            echo "### Image sizes (ESP-IDF 5.5.2)"
            echo '```'
            grep ' KB / ' merge.log
            echo '```'
            echo
            echo "### SHA-256"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # release already drafted/published on GitHub (which also creates the tag): attach the images
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$main" RetroESP32_P4_Tab5.bin SHA256SUMS
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            verify=(--verify-tag)               # tag pushes: the tag exists; main builds: create it here
            [ "$REF_TYPE" = tag ] || verify=(--target "$GITHUB_SHA")
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${verify[@]}" \
              --title "$title" --notes-file notes.md "${prerelease[@]}" \
              "$main" RetroESP32_P4_Tab5.bin SHA256SUMS
          fi
